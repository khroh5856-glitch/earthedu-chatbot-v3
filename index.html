<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학 챗봇 선생님 & 학습 노트</title>
    <style>
        /* =======================================
           여기는 CSS (디자인) 영역입니다.
           ======================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f0f0; /* 전체 배경은 부드러운 회색 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            gap: 20px;
            padding: 20px;
        }

        .chat-section, .note-section {
            flex: 1;
            display: flex;
            justify-content: center;
            min-width: 300px; 
        }

        /* 💛 카카오톡 스타일 챗봇 배경 (하늘색) */
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: #b2c7d9; 
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .chat-header {
            background-color: #ffffff;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .chat-header h2 { font-size: 1.2rem; color: #333; font-weight: 600; }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.2); border-radius: 3px; }

        .message { display: flex; max-width: 75%; }
        .user-message { align-self: flex-end; }
        .bot-message { align-self: flex-start; }

        /* 공통 말풍선 모양 */
        .bubble {
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* 💛 카톡 스타일 학생 말풍선 (노란색, 오른쪽 꼬리) */
        .user-message .bubble {
            background-color: #fef01b; 
            color: #000;
            border-top-right-radius: 4px; 
        }

        /* 🤍 카톡 스타일 AI 말풍선 (하얀색, 왼쪽 꼬리) */
        .bot-message .bubble {
            background-color: #ffffff;
            color: #000;
            border-top-left-radius: 4px;
        }

        /* 하단 입력창 영역 */
        .input-area {
            background-color: #ffffff;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 1rem;
        }

        #user-input:focus { border-color: #fee500; }

        /* 카톡 스타일 전송 버튼 (노란색) */
        #send-btn {
            background-color: #fee500;
            color: #000;
            border: none;
            padding: 0 20px;
            height: 45px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        #send-btn:hover { background-color: #e6cf00; }

        /* =======================================
           오른쪽: 학습 노트 디자인
           ======================================= */
        .note-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .note-header {
            background-color: #0e0f37;
            color: white;
            padding: 16px;
            text-align: center;
        }

        .note-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-block label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            line-height: 1.4;
        }

        .question-block textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: #fafafa;
        }

        .question-block textarea:focus { border-color: #0e0f37; outline: none; background-color: #ffffff;}

        #feedback-btn {
            background-color: #0e0f37;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
        }

        .feedback-box {
            background-color: #f9f9f9;
            border-left: 5px solid #0e0f37;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .feedback-box h3 { margin-bottom: 10px; color: #2c3e50; font-size: 1.05rem; }
        .feedback-box.hidden { display: none; }

        /* 📱 화면 좁아지면 세로로 배치 */
        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; height: auto; }
            .chat-container { max-width: 100%; height: 60vh; }
            .note-container { max-width: 100%; height: 80vh; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="chat-section">
            <div class="chat-container">
                <header class="chat-header">
                    <h2>지구과학 챗봇 🌏</h2>
                </header>
                <div class="chat-box" id="chat-box"></div>
                <div class="input-area">
                    <input type="text" id="user-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                    <button id="send-btn">전송</button>
                </div>
            </div>
        </div>

        <div class="note-section">
            <div class="note-container">
                <header class="note-header">
                    <h2>📝 학습 활동지 </h2>
                </header>
                <div class="note-content">
                    <div class="question-block">
                        <label>1. [기압과 부피 변화] 공기 덩어리가 하늘 높이 올라가면, 공기 덩어리의 기압과 부피는 어떻게 변하나요?</label>
                        <textarea id="ans1" placeholder="예: ~해서 ~하게 된다"></textarea>
                    </div>
                    <div class="question-block">
                        <label>2. [단열 팽창과 기온 하강] 팽창한 공기 덩어리의 온도는 왜 낮아질까요? (단열 팽창, 일, 에너지 포함)</label>
                        <textarea id="ans2"></textarea>
                    </div>
                    <div class="question-block">
                        <label>3. [공기의 상승] 자연 상태에서 공기 덩어리가 상승하는 경우를 두 가지 이상 쓰세요.</label>
                        <textarea id="ans3"></textarea>
                    </div>
                    <div class="question-block">
                        <label>4. (임시) [구름 생성 과정 총정리] 구름이 만들어지는 전체 과정을 적어보세요.</label>
                        <textarea id="ans4"></textarea>
                    </div>
                    <button id="feedback-btn">AI 선생님에게 노트 확인받기 ✨</button>
                    <div id="feedback-box" class="feedback-box hidden">
                        <h3>💡 선생님의 맞춤 피드백</h3>
                        <div id="feedback-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* =======================================
           여기는 JS (기능) 영역입니다.
           ======================================= */
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const feedbackBtn = document.getElementById('feedback-btn');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackContent = document.getElementById('feedback-content');

        const API_KEY = "AIzaSyAk3" + "cA2gurMhaEBGBmkwLnuIoBAlEfzqt8";
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwncet7mcm6WiMOZU7udufKQEWE1WWz0c5AN29JFmfGJ-2hOwGtLzMBXIDPbqOszwVLew/exec"; 

        let chatHistory = [];
        let studentName = ""; 
        let isNameStep = true; 

        const systemInstruction = 
        
`당신은 중학교 3학년 학생들의 과학 개념 학습을 돕는 친절하고 인내심 많은 소크라테스식 AI 튜터입니다.
학생이 '단열 팽창에 의한 기온 하강' 개념을 스스로 깨우치도록 돕는 것이 최종 목표입니다.

# RAG 및 답변 제한 지침
1. 중학교 3학년 과학 교육과정을 벗어나는 고등학교 수준의 용어(엔탈피, 이상기체 상태방정식 등)는 절대 사용하지 마십시오.
2. 한 번에 하나의 짧고 명확한 질문만 던지고 학생의 답변을 기다리십시오. 장황한 설명이나 직접적인 정답 제시는 금지입니다.
3. 교과서 범위를 벗어나는 질문에는 "우리가 배우는 교과서 범위에서는 다루지 않는 내용이야. 다시 구름의 생성 과정으로 돌아가 볼까?"라고 대화의 방향을 유도하십시오.
4. 학생을 칭찬하고 격려하는 부드러운 말투를 사용하십시오.

# 수업 진행 단계
[1단계: 진단 및 선수 학습 확인] (※ 이미 첫 질문인 '기압 변화'는 시스템이 묻습니다. 학생의 대답을 듣고 평가부터 시작하세요.)
- 행동: 고도가 높아질 때 기압이 "낮아진다"고 정답을 맞히면 칭찬 후 퀴즈: "그럼 하늘 높이 올라가서 기압이 낮아지면, 공기 덩어리의 크기(부피)는 어떻게 변할까?"

[2단계: 오개념 노출 및 인지 갈등 유발]
- 행동: "맞아! 부피가 커지지. 그럼 팽창하면서 하늘 높이 올라간 공기 덩어리의 기온은 왜 낮아질까?"
- 대응: 학생이 '주변 공기가 차가워서'라고 답하면, "거대한 공기 덩어리는 상승 속도가 매우 빨라서 주변과 열을 주고받을 시간이 거의 없어. 열을 빼앗긴 게 아닌데도 온도가 내려가는데, 왜 그럴까?"라며 갈등 유발.

[3단계: 소크라테스식 발문]
- 1) "공기가 팽창하면서 주변 공기를 바깥으로 밀어내려면 무엇이 필요할까?" (정답 유도: 일/에너지)
- 2) "정답이야! 주변에서 열을 받을 수 없는 상태에서 스스로 가진 에너지를 써서 외부 공기를 밀어내는 '일'을 한 거야. 그럼 공기 덩어리가 가진 에너지는 어떻게 되고 기온은 어떻게 변할까?"

[4단계: 개념 적용 및 형성 평가]
- 목표 1: "공기 덩어리 상승 -> 기압 하강 -> 부피 팽창 -> 일(에너지 소모) -> 기온 하강"의 흐름 서술 요구.
- 목표 2: 흐름 정리가 끝나면, "자연 상태에서 공기 덩어리가 상승하는 경우는 언제일까?" 질문 (지표면 가열, 지형, 저기압, 전선 등 4가지 유도).
- 마무리: "훌륭해! 오늘 알아낸 과정을 옆의 학습지에 잘 정리하고 발표해 보자!"라며 대화 종료.

[참고 지식: 아래 텍스트를 교과서 및 논문 내용으로 간주]
1. 단열 팽창: 외부와 열 교환 없이 부피가 늘어남.
2. 오개념 교정: "주변 공기가 차가워서 열을 뺏긴다" -> 상승 속도가 빨라 단열 상태임. "입자가 흩어져서 춥다" -> 일을 하느라 에너지를 썼음.`
;

        window.onload = () => {
            appendMessage(
            "안녕! 나는 구름이 어떻게 만들어지는지 함께 알아볼 AI 선생님이야. 시작하기 전에 이름을 알려줄래? (예: 노과학)", "bot-message"
            );
        };
        function sendToSheet(sender, message) {
            if (!WEB_APP_URL) return;
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // 💡 이 줄을 반드시 추가하세요!! (CORS 에러 무시)
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ studentName: studentName, sender: sender, message: message })
            }).catch(e => console.log(e));
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (messageText === '') return;

            appendMessage(messageText, 'user-message');
            userInput.value = '';
            scrollToBottom();

            if (isNameStep) {
                studentName = messageText;
                isNameStep = false;
                sendToSheet('시스템', `--- 챗봇 학습 시작 ---`);
                
                const firstQ = `반가워, ${studentName}! 먼저 질문 하나 할게. 하늘 높이 올라갈수록 공기 덩어리의 기압은 어떻게 될까?`;
                setTimeout(() => {
                    appendMessage(firstQ, 'bot-message');
                    sendToSheet('AI 선생님', firstQ);
                    chatHistory.push({ role: "user", parts: [{ text: `내 이름은 ${studentName}이야.` }] });
                    chatHistory.push({ role: "model", parts: [{ text: firstQ }] });
                    scrollToBottom();
                }, 500);
                return;
            }

            sendToSheet('학생', messageText);
            chatHistory.push({ role: "user", parts: [{ text: messageText }] });
            const loadingDiv = appendMessage('선생님이 답변을 생각하고 있어요... 🤔', 'bot-message');
            scrollToBottom();

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemInstruction }] },
                        contents: chatHistory,
                        generationConfig: { temperature: 0.2 }
                    })
                });
                const data = await response.json();
                const responseText = data.candidates[0].content.parts[0].text;
                
                loadingDiv.remove(); 
                appendMessage(responseText, 'bot-message'); 
                sendToSheet('AI 선생님', responseText);
                chatHistory.push({ role: "model", parts: [{ text: responseText }] });
                scrollToBottom();
            } catch (error) {
                loadingDiv.remove();
                appendMessage('앗, 오류가 발생했어요.', 'bot-message');
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', className);
            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('bubble');
            bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');
            msgDiv.appendChild(bubbleDiv);
            chatBox.appendChild(msgDiv);
            return msgDiv;
        }
        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        const noteFeedbackInstruction = 
`당신은 중학교 3학년 과학 교사입니다. 학생이 작성한 '구름 생성 과정' 학습 노트를 확인하고 피드백을 주세요.
[채점 기준 및 지침 - 매우 중요]
1. 절대 점수나 등급을 매기지 마세요.
2. 학생을 격려하고 칭찬하는 부드러운 말투를 사용하세요.
3. 문항별로 피드백을 주되, 주어나 동사가 빠져 문장이 어색하다면 완전한 문장으로 쓰도록 지도하세요.
4. 핵심 키워드(단열 팽창, 부피 팽창, 주변 공기를 밀어내는 일, 에너지 소모, 기온 하강 등) 누락 시, 직접 예시 답안을 주세요.
5. 4번 문항은 아직 완벽히 배우지 않은 (임시) 문항이므로 너무 엄격하게 평가하지 말고, 도전한 것을 크게 격려해 주세요.`
;


        async function getNoteFeedback() {
            const ans1 = document.getElementById('ans1').value.trim();
            const ans2 = document.getElementById('ans2').value.trim();
            const ans3 = document.getElementById('ans3').value.trim();
            const ans4 = document.getElementById('ans4').value.trim();

            if (!ans1 || !ans2 || !ans3 || !ans4) {
                alert("4개의 질문에 모두 답변을 작성해주세요!"); return;
            }

            feedbackBtn.innerText = "선생님이 읽고 있어요... ⏳";
            feedbackBtn.disabled = true;
            feedbackBox.classList.remove('hidden');
            feedbackContent.innerHTML = "잠시만 기다려주세요...";

            const submission = `학생 이름: ${studentName || '미입력'}\n1번: ${ans1}\n2번: ${ans2}\n3번: ${ans3}\n4번: ${ans4}`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: noteFeedbackInstruction }] },
                        contents: [{ role: "user", parts: [{ text: submission }] }],
                        generationConfig: { temperature: 0.3 }
                    })
                });
                const data = await response.json();
                const feedbackText = data.candidates[0].content.parts[0].text;
                
                feedbackContent.innerHTML = feedbackText.replace(/\n/g, '<br>');
                feedbackBtn.innerText = "AI 선생님에게 노트 확인받기 ✨";
                feedbackBtn.disabled = false;
                sendToSheet('시스템', `--- 노트 제출 ---`);
                sendToSheet('AI 피드백', feedbackText);
            } catch (error) {
                feedbackContent.innerHTML = "오류가 발생했어요.";
                feedbackBtn.innerText = "AI 선생님에게 노트 확인받기 ✨";
                feedbackBtn.disabled = false;
            }
        }
        feedbackBtn.addEventListener('click', getNoteFeedback);
    </script>
</body>
</html>
